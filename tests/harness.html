<!doctype html><meta charset="utf-8"><title>machine harness</title><link rel="icon" href="data:,"><canvas id="c"></canvas>
<script type="module">
import { defaults, MACHINES } from '/docs/machines.js';
window.MACHINES = MACHINES;
// run(id, url, max, opts) -> { ms, stats, w, h, stlBytes }; the result is drawn on the canvas
window.run = (id, url, max, opts = {}) => new Promise((done, fail) => {
  const im = new Image();
  im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height)), w = Math.round(im.width * k), h = Math.round(im.height * k);
    const t = document.createElement('canvas'); t.width = w; t.height = h; const g = t.getContext('2d'); g.drawImage(im, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h).data, wk = new Worker('/docs/worker.js', { type: 'module' });
    wk.onerror = (e) => fail(new Error('worker: ' + e.message));
    wk.onmessage = (e) => { const m = e.data; if (m.progress !== undefined) return; wk.terminate(); if (!m.ok) return fail(new Error(m.error));
      const c = document.getElementById('c'); c.width = m.w; c.height = m.h; c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(m.d), m.w, m.h), 0, 0);
      window.lastStl = m.stl; done({ ms: m.ms, stats: m.stats, w: m.w, h: m.h, stlBytes: m.stl ? m.stl.byteLength : 0 }); };
    wk.postMessage({ job: 1, id, w, h, d: d.buffer, opts: Object.assign(defaults(id), opts) }, [d.buffer]);
  };
  im.onerror = () => fail(new Error('image did not load: ' + url)); im.src = url;
});
// the STL checked in the page: every edge must be shared by exactly two triangles for a watertight solid
window.checkStl = () => { const dv = new DataView(window.lastStl), n = dv.getUint32(80, true), edges = new Map(); let bad = 0, zmax = 0, zmin = 1e9;
  for (let t = 0; t < n; t++) { const o = 84 + t * 50, v = []; for (let k = 0; k < 3; k++) { const x = dv.getFloat32(o + 12 + k * 12, true), y = dv.getFloat32(o + 16 + k * 12, true), z = dv.getFloat32(o + 20 + k * 12, true); v.push(x.toFixed(3) + ',' + y.toFixed(3) + ',' + z.toFixed(3)); if (z > zmax) zmax = z; if (z < zmin) zmin = z; }
    for (let k = 0; k < 3; k++) { const a = v[k], b = v[(k + 1) % 3], key = a < b ? a + '|' + b : b + '|' + a; edges.set(key, (edges.get(key) || 0) + (a < b ? 1 : -1)); } }
  for (const c of edges.values()) if (c !== 0) bad++;
  return { tris: n, sizeOk: window.lastStl.byteLength === 84 + n * 50, unmatchedEdges: bad, edges: edges.size, zmin, zmax }; };
</script>
